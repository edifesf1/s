function carregarYouTubeAPI(){
  if(window.YT&&window.YT.Player)return Promise.resolve();
  if(ytApiPromise)return ytApiPromise;
  ytApiPromise=new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>reject(new Error("Tempo esgotado ao carregar a API do YouTube")),15000);
    const callbackAnterior=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{
      clearTimeout(timeout);
      if(typeof callbackAnterior==="function")callbackAnterior();
      resolve();
    };
    let script=document.querySelector('script[src="https://www.youtube.com/iframe_api"]');
    if(!script){
      script=document.createElement("script");
      script.src="https://www.youtube.com/iframe_api";
      script.onerror=()=>{clearTimeout(timeout);reject(new Error("Falha ao carregar a API do YouTube"));};
      document.head.appendChild(script);
    }
  });
  return ytApiPromise;
}

// função liberarAcesso(login) - alterada
async function liberarAcesso(login){
  if(!LOGINS_VALIDOS.includes(login)){
    erroLogin.textContent="Login inválido. Confira o código e tente novamente.";
    return false;
  }

  botaoEntrar.disabled=true;
  try{
    document.body.classList.remove("bloqueado");
    telaLogin.style.display="none";
    localStorage.setItem("youtubeIptvLogin",login);
    ativarTelaCheia();
    return true;
  }catch(e){
    console.error("Erro ao liberar o acesso:",e);
    erroLogin.textContent="Não foi possível liberar o acesso.";
    return false;
  }finally{
    botaoEntrar.disabled=false;
  }
}
// FIM DA função liberarAcesso(login) - alterada

async function carregarLogins(){
  botaoEntrar.disabled=true;
  erroLogin.textContent="Carregando logins...";
  try{
    const resposta=await fetch("./LOGINS-200.txt?v="+Date.now(),{cache:"no-store"});
    if(!resposta.ok)throw new Error("HTTP "+resposta.status);
    const texto=await resposta.text();
    LOGINS_VALIDOS=[...new Set(
		texto.split(/\r?\n/)
			.map(l=>l.trim().toUpperCase())
				.filter(l=>/^[A-Z0-9]{6}$/.test(l))
	)];
    if(!LOGINS_VALIDOS.length)throw new Error("Nenhum login válido encontrado");
    erroLogin.textContent="";
	botaoEntrar.disabled=false;
	await validarLoginSalvo();
  }catch(e){
    console.error("Erro ao carregar LOGINS-200.txt:",e);
    erroLogin.textContent="Não foi possível carregar os logins.";
  }
}

function atualizarBotoesNavegacao(){botaoCanalAnterior.disabled=botaoProximoCanal.disabled=videos.length<=1;}
function navegarCanal(direcao){
  if(!videos.length)return;
  selecionado=(selecionado+direcao+videos.length)%videos.length;
  const item=videos[selecionado];
  if(menuD4.value)menuD4.value=item.titulo;
  [...lista.children].forEach((b,i)=>b.classList.toggle("ativo",i===selecionado));
  criarPlayer();
}
botaoCanalAnterior.addEventListener("click",()=>navegarCanal(-1));
botaoProximoCanal.addEventListener("click",()=>navegarCanal(1));

function preencherSelect(select,valores){
  select.replaceChildren();
  const inicial=document.createElement("option");inicial.value="";inicial.textContent="";select.appendChild(inicial);
  [...new Set(valores.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR")).forEach(valor=>{
    const option=document.createElement("option");option.value=valor;option.textContent=valor;select.appendChild(option);
  });
  select.value="";
}
function mostrarGrupo(nome,mostrar){grupos[nome].hidden=!mostrar;}
function limparAbaixo(nivel){
  if(nivel<=1){menuB2.value="";mostrarGrupo("B2",false);}
  if(nivel<=2){menuC3.value="";mostrarGrupo("C3",false);}
  if(nivel<=3){menuD4.value="";mostrarGrupo("D4",false);}
}
function aplicarFiltros(){
  const tema=menuA1.value,categoria=menuB2.value,classificacao=menuC3.value,episodio=menuD4.value;
  videos=todosVideos.filter(v=>(!tema||v.tema===tema)&&(!categoria||v.categoria===categoria)&&(!classificacao||v.classificacao===classificacao));
  lista.replaceChildren();
  const area=document.getElementById("player");
  if(hlsInstance){try{hlsInstance.destroy();}catch(e){}hlsInstance=null;}
  if(ytPlayerApi){try{ytPlayerApi.destroy();}catch(e){}ytPlayerApi=null;}
  area.replaceChildren();player=null;
  if(!videos.length){atualizarBotoesNavegacao();status.textContent=tema?"Nenhum vídeo nesta seleção.":"Selecione os menus acima.";return;}
  videos.forEach((video,index)=>{
    const botao=document.createElement("button");botao.textContent=`${index+1}. ${video.titulo}`;
    botao.addEventListener("click",()=>{selecionado=index;criarPlayer();});lista.appendChild(botao);
  });
  selecionado=episodio?videos.findIndex(v=>v.titulo===episodio):0;
  if(selecionado<0)selecionado=0;
  atualizarBotoesNavegacao();
  status.textContent=`${videos.length} vídeo(s).`;
  if(episodio||!player)criarPlayer();
}

  limparAbaixo(1);
  const tema=menuA1.value;
  if (tema === "Pesquisa") {
  ativarPesquisa(true);
  videos = [];
  atualizarBotoesNavegacao();
  document.getElementById("player").replaceChildren();
  return;
}

ativarPesquisa(false);
  if(tema){preencherSelect(menuB2,todosVideos.filter(v=>v.tema===tema).map(v=>v.categoria));mostrarGrupo("B2",true);}
  aplicarFiltros();
});
menuB2.addEventListener("change",()=>{

    return;
  }

  limparAbaixo(3);
  const tema=menuA1.value,categoria=menuB2.value,classificacao=menuC3.value;
  if(tema&&categoria&&classificacao){
    preencherSelect(menuD4,todosVideos.filter(v=>v.tema===tema&&v.categoria===categoria&&v.classificacao===classificacao).map(v=>v.titulo));
    mostrarGrupo("D4",true);
  }
  aplicarFiltros();
});
menuD4.addEventListener("change",aplicarFiltros);

function limparPlayerPesquisa(){
  geracaoPlayer++;
  if(hlsInstance){try{hlsInstance.destroy();}catch(e){}hlsInstance=null;}
  if(ytPlayerApi){try{ytPlayerApi.destroy();}catch(e){}ytPlayerApi=null;}
  document.getElementById("player").replaceChildren();
  player=null;
}

function ativarPesquisa(ativar) {
  modoPesquisa = ativar;
  campoPesquisa.style.display = ativar ? "block" : "none";
  menuB2.style.display = ativar ? "none" : "";
  mostrarGrupo("B2", ativar);
  mostrarGrupo("C3", ativar);
  mostrarGrupo("D4", false);

  if (ativar) {
    limparPlayerPesquisa();
    videos = [];
    selecionado = 0;
    campoPesquisa.value = "";
    menuC3.replaceChildren();
    const opcao = document.createElement("option");
    opcao.value = "";
    opcao.textContent = "Digite para pesquisar";
    menuC3.appendChild(opcao);
    menuC3.disabled = true;
    atualizarBotoesNavegacao();
    status.textContent = "Digite o nome de um canal ou conteúdo.";
    campoPesquisa.focus();
  } else {
    menuC3.disabled = false;
    campoPesquisa.value = "";
  }
}

function pesquisarConteudo() {
  if (!modoPesquisa) return;
  const termo = campoPesquisa.value.trim().toLocaleLowerCase("pt-BR");
  // A pesquisa considera somente os dois últimos campos: classificação (C3) e título (D4).
  const encontrados = termo
    ? todosVideos.filter(v =>
        [v.classificacao, v.titulo]
          .some(valor => String(valor || "").toLocaleLowerCase("pt-BR").includes(termo))
      )
    : [];

  // Ao mudar a busca, interrompe o conteúdo anterior para não deixar um vídeo antigo tocando.
  limparPlayerPesquisa();
  videos = encontrados;
  selecionado = 0;
  menuC3.replaceChildren();

  const inicial = document.createElement("option");
  inicial.value = "";
  inicial.textContent = termo
    ? (encontrados.length
        ? `${encontrados.length} resultado(s) encontrado(s)`
        : "Nenhum resultado encontrado")
    : "Digite para pesquisar";
  menuC3.appendChild(inicial);

  encontrados.forEach((video, indice) => {
    const opcao = document.createElement("option");
    opcao.value = String(indice);
    // Mostra juntos os campos C3 e D4 no resultado.
    opcao.textContent = [video.classificacao, video.titulo].filter(Boolean).join(" - ");
    menuC3.appendChild(opcao);
  });

  menuC3.disabled = encontrados.length === 0;
  atualizarBotoesNavegacao();
  status.textContent = encontrados.length
    ? `${encontrados.length} resultado(s). Selecione um conteúdo para reproduzir.`
    : (termo ? "Nenhum conteúdo corresponde à pesquisa." : "Digite o nome de um canal ou conteúdo.");
}

campoPesquisa.addEventListener("input", pesquisarConteudo);

function extrairId(valor){
  try{
    const url=new URL(valor);
    if(url.hostname==="youtu.be")return url.pathname.split("/").filter(Boolean)[0]||null;
    if(!["youtube.com","www.youtube.com","m.youtube.com","youtube-nocookie.com","www.youtube-nocookie.com"].includes(url.hostname))return null;
    if(url.pathname==="/watch")return url.searchParams.get("v");
    const partes=url.pathname.split("/").filter(Boolean);
    if(["embed","shorts","live","v"].includes(partes[0]))return partes[1]||null;
    return null;
  }catch(e){return null;}
}

function criarPlayer(){
  if(!videos.length)return;
  const item=videos[selecionado];if(!item)return;
  const area=document.getElementById("player"),geracao=++geracaoPlayer;
  if(ytPlayerApi){try{ytPlayerApi.destroy();}catch(e){}ytPlayerApi=null;}
  if(hlsInstance){try{hlsInstance.destroy();}catch(e){}hlsInstance=null;}
  area.replaceChildren();player=null;

  if(item.tipo==="hls"||/\.m3u8(?:$|[?#])/i.test(item.url)){
    const videoEl=document.createElement("video");
    videoEl.title=item.titulo;videoEl.controls=true;videoEl.autoplay=true;videoEl.playsInline=true;videoEl.preload="metadata";
    videoEl.style.cssText="display:block;width:100%;height:100%;object-fit:contain;background:#000;";
    area.appendChild(videoEl);player=videoEl;
    videoEl.addEventListener("error",()=>{
      const e=videoEl.error;console.error("Erro do elemento de vídeo:",{code:e?.code,message:e?.message,url:item.url});
      if(e)status.textContent="Erro no vídeo (código "+e.code+").";
    });
    if(window.Hls&&Hls.isSupported()){
      hlsInstance=new Hls({enableWorker:true,lowLatencyMode:false,backBufferLength:30,manifestLoadingTimeOut:20000,manifestLoadingMaxRetry:3,manifestLoadingRetryDelay:1000,levelLoadingTimeOut:20000,fragLoadingTimeOut:30000,fragLoadingMaxRetry:4,fragLoadingRetryDelay:1000});
      hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
        videoEl.play().then(()=>{status.textContent="Transmissão HLS reproduzindo.";}).catch(()=>{status.textContent="Transmissão carregada. Pressione Play no vídeo.";});
      });
      let rede=false,midia=false;
      hlsInstance.on(Hls.Events.ERROR,(_event,data)=>{
        console.error("Erro HLS:",data);
        if(!data.fatal)return;
        registrarFalha(item,"M3U8/HLS",data.details||data.error?.message||"Erro HLS fatal",data.response?.code||data.details||"");
        if(data.type===Hls.ErrorTypes.NETWORK_ERROR&&!rede){rede=true;hlsInstance.startLoad();}
        else if(data.type===Hls.ErrorTypes.MEDIA_ERROR&&!midia){midia=true;hlsInstance.recoverMediaError();}
        else{status.textContent="Falha HLS: "+data.details;try{hlsInstance.destroy();}catch(e){}hlsInstance=null;}
      });
      hlsInstance.loadSource(item.url);hlsInstance.attachMedia(videoEl);
    }else if(videoEl.canPlayType("application/vnd.apple.mpegurl")){
      videoEl.src=item.url;videoEl.play().catch(()=>{status.textContent="Transmissão carregada. Pressione Play no vídeo.";});
    }else status.textContent="Este navegador não oferece suporte à reprodução HLS.";
    return;
  }

  const container=document.createElement("div");container.id="youtube-player-container-"+geracao;
  container.style.cssText="width:100%;height:100%;background:#000;";area.appendChild(container);
  status.textContent="Carregando player do YouTube…";
  carregarYouTubeAPI().then(()=>{
    if(geracao!==geracaoPlayer||!area.contains(container))return;
    ytPlayerApi=new YT.Player(container.id,{
      width:"100%",height:"100%",videoId:item.id,
      playerVars:{autoplay:1,playsinline:1,rel:0,enablejsapi:1,origin:location.origin},
      events:{
        onReady:event=>{status.textContent="Player do YouTube carregado.";event.target.playVideo();},
        onStateChange:event=>{if(event.data===YT.PlayerState.PLAYING)status.textContent="Reproduzindo: "+item.titulo;},
        onError:event=>{
          const mensagens={2:"Parâmetro ou ID de vídeo inválido",5:"Erro no player HTML5 do YouTube",100:"Vídeo removido, privado ou não encontrado",101:"Vídeo não permite reprodução incorporada",150:"Vídeo não permite reprodução incorporada",153:"Erro de identificação do player ou Referer"};
          status.textContent="Falha no canal: "+item.titulo+". Código "+event.data;
          registrarFalha(item,"YouTube",mensagens[event.data]||"Erro informado pelo player do YouTube",event.data);
        }
      }
    });
    player=ytPlayerApi;
  }).catch(erro=>{
    if(geracao!==geracaoPlayer)return;
    status.textContent="Não foi possível carregar o player do YouTube.";
    registrarFalha(item,"YouTube",erro.message||"Falha ao carregar a API do YouTube","API");
  });
}

async function carregarLista(){
  try{
    const resposta=await fetch("./youtube.txt?v="+Date.now(),{cache:"no-store"});
    if(!resposta.ok)throw new Error("HTTP "+resposta.status);
    const texto=await resposta.text();
    todosVideos=texto.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith("#")).map((linha,indice)=>{
      const partes=linha.split("|").map(p=>p.trim());
      let tema,categoria,classificacao,titulo,url;
      if(partes.length>=5){[tema,categoria,classificacao,titulo]=partes;url=partes.slice(4).join("|").trim();}
      else if(partes.length>=3){
        const temaAntigo=partes[0]||"Geral";titulo=partes[1]||"Vídeo "+(indice+1);url=partes.slice(2).join("|").trim();
        tema=/bíblic|preg|igreja|relig|estudo/i.test(temaAntigo+" "+titulo)?"religioso":"normal";
        categoria=/live|ao vivo|rádio|radio|notícia|cnn|jovem pan|record news|sbt news/i.test(titulo+" "+url)?"live":"filmes";
        classificacao=temaAntigo;
      }else if(partes.length===2){titulo=partes[0]||"Vídeo "+(indice+1);url=partes[1];tema="normal";categoria="filmes";classificacao="Geral";}
      else{titulo="Vídeo "+(indice+1);url=partes[0];tema="normal";categoria="filmes";classificacao="Geral";}
      tema=tema||"Normal";categoria=categoria||"Filmes";classificacao=classificacao||"Geral";titulo=titulo||"Vídeo "+(indice+1);
      const id=extrairId(url),tipo=/\.m3u8(?:$|[?#])/i.test(url)?"hls":(id?"youtube":"desconhecido");
      if(tipo==="hls")return{tema,categoria,classificacao,titulo,id:null,url,tipo};
      return id?{tema,categoria,classificacao,titulo,id,url,tipo}:null;
    }).filter(Boolean);
    // "Pesquisa" fica sempre como primeira opção; os temas vêm depois em ordem alfabética.
    const temas = [...new Set(todosVideos.map(v => v.tema).filter(Boolean))]
      .filter(tema => tema !== "Pesquisa")
      .sort((a, b) => a.localeCompare(b, "pt-BR"));
    menuA1.replaceChildren();
    const opcaoPesquisa = document.createElement("option");
    opcaoPesquisa.value = "Pesquisa";
    opcaoPesquisa.textContent = "Pesquisa";
    menuA1.appendChild(opcaoPesquisa);
    temas.forEach(tema => {
      const opcao = document.createElement("option");
      opcao.value = tema;
      opcao.textContent = tema;
      menuA1.appendChild(opcao);
    });
    menuA1.value = "";
    limparAbaixo(1);
    aplicarFiltros();
  }catch(erro){console.error(erro);status.textContent="Erro ao ler youtube.txt. Verifique se o arquivo está publicado no GitHub Pages.";}
}

carregarLogins();
carregarLista();
</script>
